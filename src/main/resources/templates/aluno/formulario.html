<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Formulário Aluno</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="page-shell"><section class="content-card form-card">
    <h2 class="page-title">Cadastro de Aluno</h2>
    <form th:action="@{/alunos/salvar}" th:object="${aluno}" method="post">
        <input type="hidden" th:field="*{id}"/>
        <div class="mb-3"><label class="form-label">Nome</label><input type="text" th:field="*{nome}" class="form-control" required/></div>
        <div class="mb-3"><label class="form-label">E-mail</label><input type="email" th:field="*{email}" class="form-control" required/></div>
        <div class="mb-3"><label class="form-label">RG</label><input type="text" th:field="*{rg}" class="form-control" required/></div>
        <button type="submit" class="btn btn-success">Salvar</button>
        <a href="/alunos" class="btn btn-secondary">Cancelar</a>
    </form>
</section></main></body>
</html>
