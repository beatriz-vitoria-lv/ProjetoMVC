<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Alunos</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body><main class="page-shell">
    <div class="content-card"><h2 class="page-title">Lista de Alunos</h2>
    <div class="actions"><a href="/alunos/novo" class="btn btn-primary">Novo Aluno</a>
    <a href="/" class="btn btn-secondary">Voltar</a></div>
    <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>
    <div class="table-responsive"><table class="table table-hover align-middle">
        <thead><tr><th>ID</th><th>Nome</th><th>E-mail</th><th>RG</th><th>Ações</th></tr></thead>
        <tbody>
            <tr th:each="registroAluno : ${alunos}">
                <td th:text="${registroAluno.id}"></td>
                <td th:text="${registroAluno.nome}"></td>
                <td th:text="${registroAluno.email}"></td>
                <td th:text="${registroAluno.rg}"></td>
                <td>
                    <a th:href="@{/alunos/editar/{id}(id=${registroAluno.id})}" class="btn btn-sm btn-warning">Editar</a>
                    <form th:action="@{/alunos/excluir/{id}(id=${registroAluno.id})}" method="post" style="display:inline;"><button type="submit" class="btn btn-sm btn-danger">Excluir</button></form>
                </td>
            </tr>
        </tbody>
    </table></div></div>
</main></body>
</html>
