<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Formulário Curso</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="page-shell"><section class="content-card form-card">
    <h2 class="page-title">Cadastro de Curso</h2>
    <form th:action="@{/cursos/salvar}" th:object="${curso}" method="post">
        <input type="hidden" th:field="*{id}"/>
        <div class="mb-3"><label class="form-label">Nome</label><input type="text" th:field="*{nome}" class="form-control" required/></div>
        <div class="mb-3"><label class="form-label">Descrição</label><textarea th:field="*{descricao}" class="form-control"></textarea></div>
        <div class="mb-3"><label class="form-label">Carga Horária (h)</label><input type="number" th:field="*{cargaHoraria}" class="form-control" required min="1"/></div>
        <button type="submit" class="btn btn-success">Salvar</button>
        <a href="/cursos" class="btn btn-secondary">Cancelar</a>
    </form>
</section></main></body>
</html>
